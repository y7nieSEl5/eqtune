name: CI

on:
  push:
  pull_request:

# Superseded runs on the same branch/PR are wasted work; cancel them.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep both Rust/cc dependency builds and the final Mach-O at the public minimum.
  MACOSX_DEPLOYMENT_TARGET: "14.2"

jobs:
  check:
    # push covers every same-repo branch; only let pull_request run for
    # forks, so same-repo PR branches don't run CI twice (push + PR).
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name != github.repository
    # The Core Audio shim (shim/tap_shim.m) only compiles and links on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: aarch64-apple-darwin, x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --all-targets -- -D warnings

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: tests
        run: cargo nextest run

      - name: deployment builds
        run: |
          for target in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --target "$target"
            minos=$(vtool -show-build "target/$target/release/eqtune" |
              awk '/minos/{print $2; exit}')
            test "$minos" = "$MACOSX_DEPLOYMENT_TARGET"
          done
